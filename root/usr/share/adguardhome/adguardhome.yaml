http:
  pprof:
    port: 6060
    enabled: false
  address: 0.0.0.0:3000
  session_ttl: 720h
users:
  - name: admin
    # 默认密码：admin（安装后请尽快在 AGH Web 界面修改）
    password: $2y$12$hIi44laPKp4y6Rqyw.pGdOO.wgAd663pe61IPSEr.weL0hyxHN056
auth_attempts: 5
block_auth_min: 15
http_proxy: ""
